<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ApexRig 2D — Vehicle & Tank Builder</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
</head>
<body>
  <div id="game-wrapper">
    <canvas id="game-canvas"></canvas>

    <!-- Thanh công cụ trên cùng -->
    <div id="top-bar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span id="game-title">APEXRIG 2D</span>
        <span class="mode-badge" id="mode-badge">BUILD MODE</span>
      </div>

      <div class="stats" id="build-stats">
        <span>Khối lượng: <b id="stat-mass">0</b></span>
        <span>Lực đẩy/tên lửa: <b id="stat-thrust">0</b></span>
        <span>Pháo: <b id="stat-cannons">0</b></span>
      </div>

      <div class="top-actions">
        <button id="btn-toggle-mode" class="btn btn-primary">▶ LÁI THỬ</button>
        <button id="btn-clear" class="btn btn-danger">🗑 XÓA XE</button>
      </div>
    </div>

    <!-- Thanh chọn linh kiện ở dưới (chế độ lắp ráp) -->
    <div id="build-dock">
      <div class="parts-list" id="parts-list"></div>
      <div class="build-hints">
        <span><b>Chuột trái / Chạm:</b> Đặt khối</span>
        <span><b>Chuột phải / Nút Xoay:</b> Xoay khối</span>
        <span><b>Shift + Click / Nút Xóa:</b> Gỡ khối</span>
      </div>
      <div class="dock-tools">
        <button id="btn-rotate" class="btn btn-ghost">↻ Xoay (R)</button>
        <button id="btn-eraser" class="btn btn-ghost">✖ Gỡ khối</button>
      </div>
    </div>

    <!-- Điều khiển khi lái thử -->
    <div id="drive-hud" class="hidden">
      <div class="drive-controls-left">
        <button class="pad-btn" id="ctrl-left">◀ Lùi / Nghiêng sau</button>
        <button class="pad-btn" id="ctrl-right">Ga / Nghiêng trước ▶</button>
      </div>
      <div class="drive-controls-right">
        <button class="pad-btn boost" id="ctrl-boost">🔥 TÊN LỬA (Space)</button>
        <button class="pad-btn fire" id="ctrl-fire">💥 BẮN PHÁO (Click / F)</button>
      </div>
    </div>
  </div>

  <script src="js/parts.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/physics.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
